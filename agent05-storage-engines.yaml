      - "mptest/"
      - "autoconf/"
      - "contrib/"
      - "ext/wasm/"
    filesystem_value:
      - "Pager, WAL, rollback journal, page cache, and VFS code are a minimal crash-consistency textbook in source form."
      - "VFS examples expose filesystem boundary assumptions, locking, checksums, tracing, and custom backing stores."

