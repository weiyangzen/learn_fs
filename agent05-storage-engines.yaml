      - "Raftstore, region split/merge, snapshots, raft log GC, async I/O, SST import, storage traits, RocksDB integration, and MVCC read/write path."
      - "Directly useful for distributed filesystem metadata placement, replicated journal design, and recovery from partial replicas."

  - name: "raft-engine"
    upstream: "https://github.com/tikv/raft-engine.git"
    branch: "master"
    verified_commit: "29a4e7c"
    recommended_path: "engines/distributed/raft-engine"
    include:
