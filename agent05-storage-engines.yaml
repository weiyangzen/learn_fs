agent: "05"
scope: "storage-engines-for-filesystem-study"
date: "2026-06-15"
selection_rule: >
  Include source that directly teaches filesystem or distributed filesystem
  design: WAL/journal formats, SST/table formats, LSM compaction, page cache,
  buffer cache, B-tree/page managers, VFS/env/file abstractions, snapshots,
  checkpoints, object/remote storage, raft log storage, shard movement, and
  crash recovery. Exclude language bindings, CI, generated release assets,
  broad SQL/query layers, CLI tools, benchmarks, fuzzers, and large test suites
  unless a specific test is later needed as a crash-consistency oracle.
target_directory: "engines/"
repositories:
  - name: "rocksdb"
    upstream: "https://github.com/facebook/rocksdb.git"
    branch: "main"
    verified_commit: "c9252b9"
    recommended_path: "engines/lsm/rocksdb"
    include:
      - "db/"
      - "db/blob/"
      - "db/compaction/"
      - "db/db_impl/"
      - "table/"
      - "table/block_based/"
      - "memtable/"
      - "file/"
      - "env/"
      - "cache/"
      - "utilities/transactions/"
      - "utilities/checkpoint/"
      - "utilities/backup/"
      - "utilities/blob_db/"
      - "utilities/persistent_cache/"
      - "utilities/sorted_run_builder/"
      - "utilities/table_properties_collectors/"
      - "utilities/write_batch_with_index/"
      - "include/rocksdb/"
      - "util/"
      - "options/"
      - "monitoring/"
      - "memory/"
      - "logging/"
      - "port/"
    exclude:
      - "java/"
      - "third-party/"
      - "db_stress_tool/"
      - "microbench/"
      - "fuzz/"
      - "coverage/"
      - "wiki/"
      - "*_test.*"
    filesystem_value:
      - "Mature LSM write path, WAL, MANIFEST, version set, flush, compaction, and file lifecycle."
      - "Env/FileSystem abstraction for POSIX, direct I/O, fsync, rate limiting, and pluggable storage backends."
      - "Block cache, persistent cache, blob files, checkpoints, and backup flows relevant to FS snapshots and object layout."

  - name: "leveldb"
    upstream: "https://github.com/google/leveldb.git"
    branch: "main"
    verified_commit: "7ee830d"
    recommended_path: "engines/lsm/leveldb"
    include:
      - "db/"
      - "table/"
      - "util/"
      - "helpers/memenv/"
      - "include/leveldb/"
      - "port/"
      - "doc/log_format.md"
    exclude:
      - "benchmarks/"
      - "issues/"
      - "third_party/"
      - "*_test.*"
    filesystem_value:
      - "Compact reference LSM implementation with readable WAL, table, memtable, version-set, and Env code."
      - "Good baseline before reading RocksDB/Pebble complexity."

  - name: "badger"
    upstream: "https://github.com/dgraph-io/badger.git"
    branch: "main"
    verified_commit: "284cea0"
    recommended_path: "engines/lsm/badger"
    include:
      - "*.go"
      - "table/"
      - "skl/"
      - "y/"
      - "options/"
      - "fb/BlockOffset.go"
      - "fb/TableIndex.go"
    exclude:
      - "badger/cmd/"
      - "integration/"
      - "images/"
      - "docs/"
      - "trie/"
      - "pb/"
      - "*_test.go"
    filesystem_value:
      - "Value-log separation, discard statistics, value GC, mmap/file handling, and LSM levels in a compact Go codebase."
      - "Useful comparison point for log-structured FS segment cleaning and large-value placement."

  - name: "pebble"
    upstream: "https://github.com/cockroachdb/pebble.git"
    branch: "master"
    verified_commit: "b658835"
    recommended_path: "engines/lsm/pebble"
    include:
      - "*.go"
      - "internal/arenaskl/"
      - "internal/base/"
      - "internal/cache/"
      - "internal/compact/"
      - "internal/manifest/"
      - "internal/rangedel/"
      - "internal/rangekey/"
      - "internal/sstableinternal/"
      - "internal/keyspan/"
      - "objstorage/"
      - "record/"
      - "sstable/"
      - "vfs/"
      - "wal/"
      - "batchrepr/"
      - "valsep/"
      - "rangedel/"
      - "rangekey/"
      - "metrics/"
    exclude:
      - "cmd/"
      - "bench/"
      - "metamorphic/"
      - "cockroachkvs/"
      - "internal/mkbench/"
      - "replay/"
      - "*_test.go"
      - "testdata/"
    filesystem_value:
      - "Modern Go LSM with clear record/WAL, table, manifest, compaction, range deletion, and VFS layers."
      - "Object storage provider, remote backing, shared cache, and virtualized SST ideas map well to tiered/distributed FS design."

  - name: "wiredtiger"
    upstream: "https://github.com/wiredtiger/wiredtiger.git"
    branch: "develop"
    verified_commit: "8b8983d"
    recommended_path: "engines/btree/wiredtiger"
    include:
      - "src/block/"
      - "src/block_cache/"
      - "src/block_disagg/"
      - "src/btree/"
      - "src/cache/"
      - "src/checkpoint/"
      - "src/checksum/"
      - "src/conn/"
      - "src/evict/"
      - "src/history/"
      - "src/include/"
      - "src/live_restore/"
      - "src/log/"
      - "src/meta/"
      - "src/os_common/"
      - "src/os_darwin/"
      - "src/os_linux/"
      - "src/os_posix/"
      - "src/os_win/"
      - "src/reconcile/"
      - "src/rollback_to_stable/"
      - "src/schema/"
      - "src/session/"
      - "src/support/"
      - "src/tiered/"
      - "src/txn/"
      - "src/utilities/"
      - "ext/page_log/palite/"
      - "ext/storage_sources/dir_store/"
    exclude:
      - "bench/"
      - "test/"
      - "examples/"
      - "lang/"
      - "dist/"
      - "src/docs/"
      - "ext/test/"
    filesystem_value:
      - "Production B-tree/page/block manager with eviction, checkpoints, history store, logging, reconciliation, and rollback-to-stable."
      - "Tiered storage and storage-source extension points are directly relevant to object-backed and disaggregated filesystems."

  - name: "sqlite"
    upstream: "https://github.com/sqlite/sqlite.git"
    branch: "master"
    verified_commit: "a5e5116"
    recommended_path: "engines/page/sqlite"
    include:
      - "src/btree.c"
      - "src/btree.h"
      - "src/btreeInt.h"
      - "src/pager.c"
      - "src/pager.h"
      - "src/pcache.c"
